<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pricing — Aether SaaS</title>
<style>
:root { --bg:#0a0a0a; --card:#141414; --border:#2a2a2a; --text:#f5f5f5; --muted:#888; --accent:#c9a227; }
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text)}
.container{max-width:1000px;margin:0 auto;padding:3rem 1.5rem}
header{text-align:center;margin-bottom:2.5rem}
header h1{font-size:2.4rem;font-weight:600}
nav{text-align:center;margin-bottom:2rem}
nav a{color:var(--muted);margin:0 1rem;text-decoration:none}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem}
@media(max-width:800px){.plans{grid-template-columns:1fr}}
.plan{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:2rem;text-align:center}
.plan h2{font-size:1.2rem;margin-bottom:.5rem}
.price{font-size:2.4rem;font-weight:600;margin:.5rem 0}
.price span{font-size:1rem;color:var(--muted)}
ul{list-style:none;margin:1.5rem 0;text-align:left}
li{padding:.4rem 0;font-size:.95rem}
button{background:var(--accent);color:#000;border:none;padding:.7rem 1.5rem;border-radius:8px;font-weight:600;cursor:pointer;width:100%}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Pricing</h1>
    <p style="color:var(--muted)">Simple plans. Connect Stripe when ready.</p>
  </header>
  <nav><a href="/">Builder</a> <a href="/pricing">Pricing</a></nav>
  <div class="plans" id="plans"></div>
</div>
<script>
fetch('/api/pricing').then(r=>r.json()).then(plans => {
  document.getElementById('plans').innerHTML = Object.entries(plans).map(([k,p]) => `
    <div class="plan">
      <h2>${p.name}</h2>
      <div class="price">$${p.price}<span>/mo</span></div>
      <ul>
        <li>${p.products} products</li>
        <li>${p.stores} store${p.stores>1?'s':''}</li>
        <li>Apliiq guide</li>
        <li>Shopify push</li>
      </ul>
      <button onclick="checkout('${k}')">Start ${p.name}</button>
    </div>
  `).join('');
});
async function checkout(plan) {
  const res = await fetch('/api/checkout', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({plan})});
  const data = await res.json();
  alert(data.message + '\nPlan: ' + data.plan.name);
}
</script>
</body>
</html>
